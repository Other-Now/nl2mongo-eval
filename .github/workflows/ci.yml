name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.2
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: admin
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet -u admin -p admin --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Load sample_mflix and create the read-only user
        run: python data/load_mflix.py
      - name: Question set is up to date with its source
        run: |
          python eval/build_questions.py
          python eval/check_gold.py --write > gold.txt
          git diff --exit-code eval/questions.jsonl
      - name: Tests (guard, scorer, parser, retrieval, gold pipelines, read-only user)
        run: python -m pytest -v
      - name: Summary tables from committed results
        run: python summarize.py >> "$GITHUB_STEP_SUMMARY"
